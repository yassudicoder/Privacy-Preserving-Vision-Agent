<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | SIH Shop</title><link rel="stylesheet" href="style.css"></head><body class="shop-page"><header class="shop-header"><a class="shop-brand" href="/index.html">SIH Shop</a><form id="shop-search-form" class="shop-search"><label for="shop-search">Search products</label><input id="shop-search" type="search" placeholder="Search products"><button type="submit">Search</button></form><a class="shop-cart" href="/cart.html">Cart (<output id="shop-cart-count">0</output>)</a></header><main class="shop-main"><p class="shop-breadcrumb"><a href="/cart.html">Cart</a> / Checkout</p><h1>Checkout</h1><p class="shop-notice">Demo checkout only. No order or payment leaves this local test site.</p><form class="checkout-form" id="checkout-form"><label>Full name<input type="text" name="name" autocomplete="name"></label><label>Delivery address<input type="text" name="address" autocomplete="street-address"></label><label>Payment method<select name="payment"><option>Cash on delivery</option><option>Demo card</option></select></label><button class="shop-button" type="submit">Place demo order</button></form><p id="checkout-status" role="status"></p></main><script src="shop.js"></script><script>document.getElementById('checkout-form').addEventListener('submit',function(e){e.preventDefault();document.getElementById('checkout-status').textContent='Demo order placed locally. No payment was sent.';});</script></body></html>
