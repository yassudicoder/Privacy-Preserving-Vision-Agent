<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px/1.45 ui-monospace, Consolas, monospace; width: 460px; margin: 0; padding: 12px; }
      h1 { font-size: 13px; margin: 0 0 8px; }
      label { display: inline-block; margin-right: 10px; }
      select, input { font: inherit; }
      button { font: inherit; padding: 4px 10px; margin-right: 6px; }
      #out { width: 100%; height: 300px; margin-top: 10px; font: 11px/1.35 ui-monospace, Consolas, monospace; }
      .row { margin-bottom: 8px; }
      .hint { color: #666; font-size: 11px; }
    </style>
  </head>
  <body>
    <h1>SIH26171 spike &mdash; offscreen model probe</h1>
    <div class="row">
      <label>backend
        <select id="device">
          <option value="auto">auto</option>
          <option value="webgpu">webgpu</option>
          <option value="wasm">wasm</option>
        </select>
      </label>
      <label>dtype
        <select id="dtype">
          <option value="fp32">fp32</option>
          <option value="q8">q8</option>
          <option value="fp16">fp16</option>
        </select>
      </label>
      <label>frames <input id="frames" type="number" value="10" min="1" max="200" size="4" /></label>
    </div>
    <div class="row">
      <button id="run">Run</button>
      <button id="reset">Tear down offscreen</button>
      <button id="clearcache">Clear model cache</button>
      <button id="copy">Copy JSON</button>
    </div>
    <div class="hint">First run downloads weights (cold). Run twice for the warm number.</div>
    <textarea id="out" readonly></textarea>
    <script src="popup.js"></script>
  </body>
</html>
