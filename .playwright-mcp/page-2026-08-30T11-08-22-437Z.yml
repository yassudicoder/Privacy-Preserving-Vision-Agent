      - list [ref=f1e105]:
        - listitem [ref=f1e106]:
          - strong [ref=f1e107]:
            - text: The checkbox has no
            - code [ref=f1e108]: checked
            - text: binding.
          - text: It renders unticked every time the panel opens, whatever the background actually holds — so clicking it after reopening turns vision
          - emphasis [ref=f1e109]: "off"
          - text: . Watch for the notice at toggle time.
        - listitem [ref=f1e110]:
          - strong [ref=f1e111]: The breaker is latched.
          - text: Three consecutive detect failures disable vision for the life of the background context. Only
          - strong [ref=f1e112]: Run task
          - text: resets it; reload the extension if in doubt.
