    - article [ref=f25e2580]:
      - generic [ref=f25e2581]:
        - heading "Q - How do I book a domestic flight on MakeMyTrip?" [level=2] [ref=f25e2582]
        - generic [ref=f25e2583]: "A: You can book a domestic flight on MakeMyTrip in five steps. Open the flight booking page, enter your departure and arrival cities, select your travel dates and the number of travellers, choose a flight from the search results, and complete the payment. The same steps work on the MakeMyTrip app, and your e-ticket reaches your email and mobile within a few minutes of payment."
      - generic [ref=f25e2586]:
        - heading "Q - How can I find the cheapest domestic flight fares on MakeMyTrip?" [level=2] [ref=f25e2587]
        - generic [ref=f25e2588]: "A: Sort the search results by price so that the lowest fare appears at the top, and use the fare calendar to see the cheapest dates around your travel plan. You can also filter by airline, by non stop flights and by departure time. We recommend checking the offers section before payment, as a bank offer or a promo code can lower the amount further."
      - generic [ref=f25e2591]:
        - heading "Q - How far in advance should I book a domestic flight in India?" [level=2] [ref=f25e2592]
        - generic [ref=f25e2593]: "A: We recommend booking a domestic flight 3 to 6 weeks before departure, as airlines usually still have seats in their lower fare buckets during this period. For travel during Diwali, Christmas or the summer school holidays, we recommend booking 3 to 4 months ahead, because seats on popular routes sell out early in these weeks."
      - generic [ref=f25e2596]:
        - heading "Q - Which airlines can I book domestic flights with on MakeMyTrip?" [level=2] [ref=f25e2597]
        - generic [ref=f25e2598]: "A: You can book all the major Indian carriers on MakeMyTrip, and the airlines shown in your search depend on which of them operate the route and date you have entered. Use the airline filter on the results page if you already have a preferred carrier, and please check the baggage allowance listed with each fare before you select one."
      - generic [ref=f25e2601]:
        - heading "Q - What is the Zero Cancellation feature on MakeMyTrip?" [level=2] [ref=f25e2602]
        - generic [ref=f25e2603]: "A: Zero Cancellation is an add on you can select while booking, for a fee that starts at ₹149 per passenger. If you cancel the booking at least 24 hours before departure, both the airline cancellation penalty and the MakeMyTrip penalty are waived. The Zero Cancellation fee and the convenience fee paid at the time of booking are not refundable."
      - generic [ref=f25e2606]:
        - heading "Q - What is the Price Lock feature on MakeMyTrip?" [level=2] [ref=f25e2607]
        - generic [ref=f25e2608]: "A: Price Lock lets you hold a flight fare for a set period while you finalise your plans, for a one time fee charged per passenger. If the fare rises during that period you still pay the locked price, and if it falls you pay the lower fare. Please complete the booking from My Trips before the hold period ends, as the locked fare lapses after that."
      - generic [ref=f25e2611]:
        - heading "Q - What is the Price Drop Protection feature on MakeMyTrip?" [level=2] [ref=f25e2612]
        - generic [ref=f25e2613]: "A: Price Drop Protection is an add on you can select while booking, for a fee charged per passenger. If the fare of your flight falls after your ticket is issued, and up to 6 hours before the scheduled departure, the difference is refunded to you. Please claim the refund on MakeMyTrip after you complete the journey and within 30 days of the departure date."
      - generic [ref=f25e2616]:
        - heading "Q - What is MMTBLACK and how do I earn myCash?" [level=2] [ref=f25e2617]
        - generic [ref=f25e2618]: "A: MMTBLACK is our loyalty programme, and myCash is the reward you earn on bookings. One myCash is worth one rupee against a future booking on MakeMyTrip. On flight bookings you earn ₹0.5 myCash for every ₹100 spent. Members also get a flat 25% discount on one flight add-on, such as an in-flight meal, a free date change or Zero Cancellation."
      - generic [ref=f25e2621]:
        - heading "Q - How do I manage my domestic flight booking and download my ticket?" [level=2] [ref=f25e2622]
        - generic [ref=f25e2623]: "A: Open the My Trips section on the MakeMyTrip website or app and select your booking to download the e-ticket as a PDF. From the same screen you can add check in baggage, select or change a seat, add a meal, request a date change or cancel the booking. Your e-ticket is also emailed to you as soon as the booking is confirmed."
