# Render Blueprint for the SIH26171 agent server.
#
# WHAT THIS DEPLOYS, and what it deliberately does not.
#
# It deploys `server/main.ts` - the SAME process that `npm run server` starts on
# a laptop. There is no production variant, no second entry point and no
# deployment-only build. That matters more here than it usually would: this
# server sits on the far side of the privacy boundary, and a second
# implementation is a second place for the checks around that boundary to be
# missing or to drift.
#
# It does NOT deploy the browser extension. The extension is built separately
# and points at this service's URL via the AGENT_ORIGIN build variable.
#
# WHAT REACHES THIS SERVICE. Only a `SanitizedContext`, and only after the
# extension's two fail-closed egress gates have passed on the client. Perception,
# PII detection, redaction, pixel-coverage verification and the outbound checks
# all run in the browser, before anything is written to a socket. Deploying the
# planner to a public host does not move any part of that; the boundary is a
# property of the client pipeline, not of where the model happens to run.
#
# Apply with: Render Dashboard -> New -> Blueprint -> point at this repo.

services:
  - type: web
    name: sih26171-agent-server
    runtime: node
    plan: free
    # The free instance sleeps after ~15 minutes of inactivity and takes tens of
    # seconds to wake. That is handled in the extension, which reports
    # "Connecting to AI server..." rather than a plan failure - see
    # `HttpAgentBackend.health` and the slow-request notice in background.ts.
    # It is NOT handled by falling back to another backend, which would send an
    # organisation's context somewhere it did not choose.
    region: singapore
    branch: main

    # `npm ci` needs the lockfile and installs devDependencies too. `tsx` is a
    # runtime dependency of this service (see package.json), so a production
    # install still has what the start command needs.
    buildCommand: npm ci

    # PORT is supplied by Render and read by server/main.ts. It is not repeated
    # here: two places holding the same fact is how they disagree.
    startCommand: npm run start

    # Render polls this. It is unauthenticated by design - it exposes a planner
    # id, a model id and three booleans, and requiring a token to ask "are you
    # alive" would make an unavailable service indistinguishable from a
    # misconfigured one.
    healthCheckPath: /health

    envVars:
      # ---------------------------------------------------------------- model
      # THE ONLY REQUIRED SECRET. `sync: false` means Render prompts for it in
      # the dashboard and never stores it in this file or in git.
      #
      # It is the credential this SERVER presents to OpenAI. It must never reach
      # the extension, and cannot: the extension only ever speaks /plan.
      - key: OPENAI_API_KEY
        sync: false

      # The cloud reasoning model. Pinned rather than left to the server's
      # default so that what runs is visible in the repository - the default
      # exists for a laptop, and a deployment should not have to be read out of
      # source to know what it is calling.
      #
      # Must be VISION-CAPABLE: the client sends the verified redacted
      # screenshot as an image part whenever one survives the pixel-coverage
      # check, and a text-only model rejects that request outright. gpt-5.6-luna
      # takes image input.
      #
      # There is deliberately NO fallback to a different model. A server that
      # quietly answered from something other than what this file names would
      # make every measurement and every receipt line about the wrong thing.
      - key: VLM_MODEL
        value: gpt-5.6-luna

      # ----------------------------------------------------------------- auth
      # The token this server requires FROM the extension. A DIFFERENT secret
      # from the one above, travelling the other way.
      #
      # Generated by Render and never shown in this file. Read it once from the
      # dashboard and paste it into the extension's Cloud AI token field.
      #
      # Strongly recommended on a public URL: a hosted endpoint with a model
      # behind it and no token is somebody else's free inference, and the bill
      # arrives before the surprise does. server/main.ts warns at startup when
      # this is unset on Render specifically.
      - key: AGENT_AUTH_TOKEN
        generateValue: true

      # --------------------------------------------------------------- runtime
      - key: NODE_VERSION
        value: "20"
